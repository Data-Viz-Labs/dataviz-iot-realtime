# Generado automáticamente: una PR por dependencia (sin agrupar).
version: 2
updates:
  - package-ecosystem: "docker"
    directories:
      - "/data_generator"
      - "/timescaledb"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
